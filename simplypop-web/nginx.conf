# Rate limiting zones - FIXED SYNTAX
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=1r/m;    # Changed from 5r/h to 1r/m
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=20r/m;

limit_conn_zone $binary_remote_addr zone=addr:10m;

# Main server block
server {
    listen 80;
    
    # Accept both Cloudflare tunnel domains AND local network access
    server_name simplypopcreations.com www.simplypopcreations.com 192.168.1.37 localhost _;
    
    client_max_body_size 10M;
    
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # CSP header - Strict policy without unsafe-inline/unsafe-eval
    # Note: React inline styles (style={{...}}) are style attributes, not inline styles, so they work fine
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https: http://192.168.1.37; font-src 'self' data:; connect-src 'self' https://simplypopcreations.com http://192.168.1.37; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    server_tokens off;
    limit_conn addr 10;
    autoindex off;

    # Serve React frontend
    location / {
        try_files $uri /index.html;
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # STATIC FILE SERVING (served directly by FastAPI's StaticFiles mount)

    location /gallery/ {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://fastapi:8001/gallery/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /client/ {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://fastapi:8001/client/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        expires 30d;
        add_header Cache-Control "public";
    }

    # PUBLIC API ENDPOINTS

    location /api/gallery {
        limit_req zone=general_limit burst=20 nodelay;

        client_max_body_size 10M;
        
        proxy_pass http://fastapi:8001/gallery;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare passes these headers
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-RAY $http_cf_ray;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Contact form - STRICT rate limiting (1 per minute with small burst)
    location /api/contact {
        limit_req zone=contact_limit burst=1 nodelay;  # 1/min, burst of 5
        
        proxy_pass http://fastapi:8001/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-RAY $http_cf_ray;
        
        client_max_body_size 10M;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/login {
        limit_req zone=login_limit burst=3 nodelay;
        
        proxy_pass http://fastapi:8001/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/health {
        proxy_pass http://fastapi:8001/health;
        access_log off;
    }

    # ADMIN API ENDPOINTS

    location ~ ^/api/(gallery-(edit|delete)/.+)$ {
        limit_req zone=admin_limit burst=10 nodelay;

        proxy_pass http://fastapi:8001/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 10M;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/contactforms {
        limit_req zone=admin_limit burst=10 nodelay;
        
        proxy_pass http://fastapi:8001/contactforms;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Catch-all for other API routes
    location /api/ {
        limit_req zone=general_limit burst=20 nodelay;
        
        proxy_pass http://fastapi:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        client_max_body_size 10M;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin) {
        deny all;
        access_log off;
        log_not_found off;
        return 444;
    }
}